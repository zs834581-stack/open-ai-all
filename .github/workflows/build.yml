name: Build Windows Release

# 推送到私人仓库（或手动触发）后，自动编译出 Windows 可执行包
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # new-api/go.mod 要求 go 1.26.10，直接读 go.mod 安装对应版本
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/new-api/go.mod
          check-latest: true
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # new-api 前端用 bun + rsbuild 构建
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 若 src/ 未提交源码，则在此克隆网关与可选清理版转换服务
      # （原 LLM-Red-Team 组织已下架，此处只用仍在维护且已清理恶意代码的版本；失败不阻塞）
      - name: Ensure sources
        shell: bash
        run: |
          if [ ! -f src/new-api/go.mod ]; then
            git clone --depth 1 https://github.com/QuantumNous/new-api.git src/new-api
          fi
          mkdir -p src/free-api
          if [ ! -d src/free-api/deepseek-free-api ]; then
            git clone --depth 1 https://github.com/Fu-Jie/deepseek-free-api.git src/free-api/deepseek-free-api || echo "skip deepseek-free-api (optional)"
          fi
          if [ ! -d src/free-api/glm-free-api ]; then
            git clone --depth 1 https://github.com/evanoooo/GLM-Free-API.git src/free-api/glm-free-api || echo "skip glm-free-api (optional)"
          fi

      # 关键：new-api 通过 //go:embed web/dist 内嵌前端，
      # 必须先构建 web 前端生成 web/dist，否则 go build 报 "pattern web/dist: no matching files found"
      - name: Build new-api.exe
        shell: bash
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd src/new-api/web
          bun install --frozen-lockfile
          VERSION_VAL="$(cat ../VERSION 2>/dev/null || true)"
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION="${VERSION_VAL:-dev}" bun run build
          test -f dist/index.html || { echo "web/dist/index.html 未生成，前端构建失败"; exit 1; }
          cd ..
          CGO_ENABLED=0 GOWORK=off go build -trimpath \
            -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=${VERSION_VAL:-dev}'" \
            -o "$GITHUB_WORKSPACE/dist/new-api.exe" .

      # Chat2API（Electron 主转换层）：electron-vite 构建前端/主进程 → electron-builder --dir 出 win-unpacked
      # 产出的整个 win-unpacked 目录即"绿色版"，拷入 dist/chat2api 后 launcher 可直接拉起 Chat2API.exe
      - name: Build Chat2API (Electron)
        shell: bash
        run: |
          set -e
          if [ ! -f src/chat2api/package.json ]; then
            echo "::warning::src/chat2api 不存在，跳过 Chat2API 构建（dist 将不含转换层）"
            exit 0
          fi
          cd src/chat2api
          echo "=== 安装依赖 ==="
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          echo "=== electron-vite 构建 ==="
          npm run build
          test -f out/main/index.js || { echo "electron-vite 构建失败：out/main/index.js 不存在"; exit 1; }
          echo "=== electron-builder --dir（免安装包/免签名） ==="
          npx electron-builder --dir --win --x64 --publish never
          test -f dist/win-unpacked/Chat2API.exe || { echo "未生成 dist/win-unpacked/Chat2API.exe"; ls -R dist | head -40; exit 1; }
          echo "构建完成：$(du -sh dist/win-unpacked | cut -f1)"

      - name: Install optional free-api deps
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p src/free-api
          for d in src/free-api/*/; do
            [ -d "$d" ] || continue
            echo "npm install in $d"
            (cd "$d" && npm install) || echo "npm install failed in $d (optional)"
          done

      - name: Build launcher.exe
        shell: bash
        run: |
          cd launcher
          npm install
          npx --yes pkg@5.8.1 . --targets node18-win-x64 --output "$GITHUB_WORKSPACE/dist/launcher.exe"

      - name: Assemble dist
        shell: bash
        run: |
          set -e
          # new-api 工作目录（launcher 也会自动创建，这里预建保证解压即用；
          # 注意 upload-artifact 会丢弃空目录，故放一个占位文件）
          mkdir -p dist/data
          echo "new-api 运行数据（数据库/日志）存放目录，勿删。" > dist/data/README.txt

          # 可选 Node 转换服务（若已克隆）
          if [ -d src/free-api ] && [ -n "$(ls -A src/free-api 2>/dev/null)" ]; then
            mkdir -p dist/free-api
            cp -r src/free-api/* dist/free-api/
          fi

          # Chat2API（主转换层）：win-unpacked 整目录平铺进 dist/chat2api
          mkdir -p dist/chat2api
          if [ -d src/chat2api/dist/win-unpacked ]; then
            cp -r src/chat2api/dist/win-unpacked/. dist/chat2api/
            test -f dist/chat2api/Chat2API.exe || { echo "拷贝后未找到 Chat2API.exe"; exit 1; }
            echo "Chat2API 已就位: $(du -sh dist/chat2api | cut -f1)"
          else
            echo "::warning::未找到 win-unpacked，dist/chat2api 为空（可用 config.json 关闭 chat2api）"
            echo "此目录预留给 Chat2API（Electron 桌面应用）。" > dist/chat2api/README.txt
          fi

          cp launcher/config.json dist/config.json
          echo "=== dist 顶层 ==="
          ls -la dist
          echo "=== 总体积 ==="
          du -sh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxy-desktop-windows
          path: dist
          retention-days: 30
          compression-level: 6
